<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бронювання (AJAX)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-4">
    <h2 class="mb-4">Система бронювання (AJAX)</h2>
    
    <div id="error-message" class="alert alert-danger d-none"></div>

    <div class="row">
        <div class="col-md-4">
            <div class="card p-3 shadow-sm mb-3">
                <form id="addForm">
                    <h5 class="mb-3">Додати номер</h5>
                    <input type="text" id="addNumber" class="form-control mb-2" placeholder="Номер кімнати" required>
                    <input type="number" id="addCapacity" class="form-control mb-2" placeholder="Місткість" required>
                    <input type="number" id="addPrice" step="0.01" class="form-control mb-3" placeholder="Ціна за добу" required>
                    <button type="submit" class="btn btn-primary w-100">Додати номер</button>
                </form>
            </div>
        </div>
        <div class="col-md-8">
            <input type="number" id="search" class="form-control mb-3 shadow-sm" placeholder=" Фільтр: мінімальна місткість...">
            <div class="table-responsive bg-white shadow-sm rounded">
                <table class="table table-hover mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>Номер</th>
                            <th>Місткість</th>
                            <th>Ціна</th>
                            <th>Статус</th>
                        </tr>
                    </thead>
                    <tbody id="results"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
